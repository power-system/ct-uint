[package]
name = "ct-uint"
version = "0.0.3"
edition = "2024"
description = "Constant-time fixed-width big integers and limb arithmetic for secret-data cryptography"
license = "MIT OR Apache-2.0"
repository = "https://github.com/power-system/ct-uint"
readme = "README.md"
keywords = ["constant-time", "bigint", "limb", "cryptography"]
categories = ["cryptography"]

[dependencies]
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false, optional = true }

[features]
default = ["zeroize"]
